name: Firebase Hosting Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/yatra-app/package-lock.json'

      - name: Install dependencies
        working-directory: frontend/yatra-app
        run: npm ci

      - name: Build React application
        working-directory: frontend/yatra-app
        run: npm run build

      - name: Deploy to Firebase Hosting Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YATRA_96243 || secrets.FIREBASE_SERVICE_ACCOUNT_YATRA }}
          channelId: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'live' || '' }}
          projectId: yatra-96243
